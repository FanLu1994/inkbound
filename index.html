<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>墨痕 · Inkbound</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: var(--app-height, 100vh);
    background: #2b2825;
    overflow: hidden;
    font-family: "KaiTi", "STKaiti", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: var(--app-height, 100vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stage-wrap {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 48px;
    padding-top: calc(48px + var(--xhs-safe-top, var(--safe-area-inset-top, env(safe-area-inset-top, 0px))));
    padding-bottom: 12px;
    padding-bottom: calc(12px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
    padding-left: 8px;
    padding-left: calc(8px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))));
    padding-right: 8px;
    padding-right: calc(8px + var(--xhs-safe-right, var(--safe-area-inset-right, env(safe-area-inset-right, 0px))));
  }
  body.touch-portrait #stage-wrap {
    padding-bottom: 132px;
    padding-bottom: calc(132px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    touch-action: none;
    background: #fdfdfb;
  }
  #topbar {
    position: fixed;
    top: 8px;
    top: calc(8px + var(--xhs-top-inset, var(--safe-area-inset-top, env(safe-area-inset-top, 0px))));
    left: 12px;
    left: calc(12px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))));
    z-index: 20;
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .top-btn {
    pointer-events: auto;
    height: 34px;
    min-width: 38px;
    padding: 0 10px;
    margin-right: 8px;
    border: 2px solid rgba(253, 253, 251, 0.72);
    border-radius: 17px;
    background: rgba(31, 60, 143, 0.78);
    color: #fdfdfb;
    font-family: inherit;
    font-size: 13px;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    outline: none;
  }
  .top-btn:last-child { margin-right: 0; }
  .top-btn:active { opacity: 0.75; }
  .top-btn:focus { border-color: #fdfdfb; }
  .top-btn[hidden] { display: none; }
  #touch {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 15;
    pointer-events: none;
    display: none;
  }
  #touch.on { display: block; }
  .tb {
    position: absolute;
    bottom: 18px;
    bottom: calc(18px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
    width: 60px;
    height: 60px;
    border: 2.5px solid rgba(244, 239, 228, 0.78);
    border-radius: 50%;
    color: #f4efe4;
    font-family: inherit;
    font-size: 24px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    background: rgba(31, 60, 143, 0.36);
    outline: none;
  }
  .tb.active, .tb:active { background: rgba(244, 239, 228, 0.38); }
  .tb.sm {
    width: 44px;
    height: 44px;
    font-size: 18px;
    bottom: 84px;
    bottom: calc(84px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
  }
  #bl {
    left: 16px;
    left: calc(16px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))));
  }
  #br {
    left: 88px;
    left: calc(88px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))));
  }
  #bdown {
    left: 60px;
    left: calc(60px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))));
  }
  #bj {
    right: 16px;
    right: calc(16px + var(--xhs-safe-right, var(--safe-area-inset-right, env(safe-area-inset-right, 0px))));
  }
  #bd {
    right: 88px;
    right: calc(88px + var(--xhs-safe-right, var(--safe-area-inset-right, env(safe-area-inset-right, 0px))));
  }
  #splash {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 30;
    background: #fdfdfb;
    color: #1f3c8f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + var(--xhs-top-inset, var(--safe-area-inset-top, env(safe-area-inset-top, 0px))));
    padding-bottom: calc(24px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
  }
  #splash[hidden] { display: none; }
  .splash-card {
    width: 100%;
    max-width: 360px;
    padding: 28px 22px;
    border: 2.5px solid #1f3c8f;
    background: #fdfdfb;
    text-align: center;
  }
  .splash-title {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 8px;
    margin-bottom: 6px;
  }
  .splash-sub {
    font-size: 14px;
    letter-spacing: 3px;
    color: #5a6ea8;
    margin-bottom: 18px;
  }
  .splash-desc {
    font-size: 16px;
    line-height: 1.6;
    color: #1f3c8f;
    margin-bottom: 18px;
  }
  .splash-status {
    font-size: 13px;
    line-height: 1.6;
    color: #5a6ea8;
  }
  .splash-retry {
    margin-top: 16px;
    padding: 8px 22px;
    border: 2px solid #1f3c8f;
    background: #1f3c8f;
    color: #fdfdfb;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .splash-retry[hidden] { display: none; }
  .lb {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 25;
    background: rgba(31, 36, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + var(--xhs-top-inset, var(--safe-area-inset-top, env(safe-area-inset-top, 0px))));
    padding-bottom: calc(20px + var(--xhs-safe-bottom, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
  }
  .lb[hidden] { display: none; }
  .lb-card {
    width: 100%;
    max-width: 360px;
    max-height: 100%;
    padding: 16px 16px 18px;
    border: 2.5px solid #1f3c8f;
    background: #fdfdfb;
    color: #1f3c8f;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lb-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .lb-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .lb-close {
    width: 30px;
    height: 30px;
    border: 2px solid #1f3c8f;
    border-radius: 50%;
    background: #fdfdfb;
    color: #1f3c8f;
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .lb-close:active { background: rgba(31, 60, 143, 0.12); }
  .lb-status { font-size: 13px; color: #5a6ea8; margin-bottom: 8px; line-height: 1.5; }
  .lb-list {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    flex: 1 1 auto;
    min-height: 0;
  }
  .lb-row {
    display: flex;
    align-items: center;
    padding: 7px 4px;
    border-bottom: 1px solid rgba(90, 110, 168, 0.25);
    font-size: 15px;
  }
  .lb-rk { width: 46px; color: #c0392b; font-weight: 700; }
  .lb-nm {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 8px;
  }
  .lb-tm { color: #1f3c8f; font-variant-numeric: tabular-nums; }
  .lb-mine {
    font-size: 14px;
    color: #1f3c8f;
    margin-bottom: 10px;
    padding-top: 6px;
    border-top: 1.5px solid rgba(31, 60, 143, 0.35);
  }
  .lb-refresh {
    align-self: center;
    padding: 7px 24px;
    border: 2px solid #1f3c8f;
    background: #1f3c8f;
    color: #fdfdfb;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .lb-refresh:active { opacity: 0.8; }
  @media (min-width: 760px) and (min-height: 500px) {
    .tb { width: 66px; height: 66px; font-size: 26px; }
    #br { left: 96px; left: calc(96px + var(--xhs-safe-left, var(--safe-area-inset-left, env(safe-area-inset-left, 0px)))); }
    #bd { right: 96px; right: calc(96px + var(--xhs-safe-right, var(--safe-area-inset-right, env(safe-area-inset-right, 0px)))); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar" aria-label="快捷控制">
    <button type="button" class="top-btn" id="btn-pause" aria-label="暂停或继续" hidden>暂停</button>
    <button type="button" class="top-btn" id="btn-restart" aria-label="重开本章" hidden>重开</button>
    <button type="button" class="top-btn" id="btn-mute" aria-label="切换静音">声音</button>
    <button type="button" class="top-btn" id="btn-rank" aria-label="排行榜" hidden>排行榜</button>
  </div>
  <div id="stage-wrap">
    <canvas id="c" aria-label="墨痕游戏画布"></canvas>
  </div>
  <div id="touch" aria-label="触屏方向与动作按键">
    <button type="button" class="tb" id="bl" data-k="left" aria-label="向左移动">◀</button>
    <button type="button" class="tb" id="br" data-k="right" aria-label="向右移动">▶</button>
    <button type="button" class="tb sm" id="bdown" data-k="down" aria-label="下穿木板">▼</button>
    <button type="button" class="tb" id="bd" data-k="dash" aria-label="冲刺">◆</button>
    <button type="button" class="tb" id="bj" data-k="jump" aria-label="跳跃">●</button>
  </div>
  <div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="九章速通排行榜" hidden>
    <div class="lb-card">
      <div class="lb-head">
        <span class="lb-title">九章速通榜</span>
        <button type="button" id="lb-close" class="lb-close" aria-label="关闭排行榜">×</button>
      </div>
      <p id="lb-status" class="lb-status" role="status">加载中…</p>
      <ol id="lb-list" class="lb-list" aria-busy="true"></ol>
      <p id="lb-mine" class="lb-mine"></p>
      <button type="button" id="lb-refresh" class="lb-refresh">刷新</button>
    </div>
  </div>
  <div id="splash" aria-busy="true">
    <div class="splash-card">
      <div class="splash-title">墨 痕</div>
      <div class="splash-sub">I N K B O U N D</div>
      <p class="splash-desc">圆珠笔手绘平台跳跃 · 穿越九章纸境，收集散落墨滴。</p>
      <p id="startup-status" class="splash-status" role="status">正在铺展纸境… 若长时间未就绪，请退出后重新打开。</p>
      <button type="button" id="startup-retry" class="splash-retry" hidden>重新加载</button>
    </div>
  </div>
</div>
<script defer src="./game.js"></script>
</body>
</html>
