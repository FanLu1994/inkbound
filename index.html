<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>墨痕 · Inkbound</title>
<style>
  html,body{margin:0;height:100%;background:#2b2825;overflow:hidden;font-family:"KaiTi","STKaiti","Segoe Print",cursive;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 20px 60px rgba(0,0,0,.6);image-rendering:auto}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  .tb{position:absolute;bottom:4vh;width:16vmin;height:16vmin;border:3px solid rgba(244,239,228,.7);border-radius:50%;color:#f4efe4;font-size:7vmin;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(0,0,0,.25)}
  .tb:active{background:rgba(244,239,228,.35)}
  #bl{left:3vw}#br{left:calc(3vw + 19vmin)}#bj{right:3vw}#bd{right:calc(3vw + 19vmin)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="tb" id="bl" data-k="left">◀</div><div class="tb" id="br" data-k="right">▶</div>
  <div class="tb" id="bd" data-k="dash">◆</div><div class="tb" id="bj" data-k="jump">●</div>
</div>
<script>
'use strict';
// =====================================================================
//  墨痕 · Inkbound  —  a pen-and-ink platformer in one file
// =====================================================================
const W=960,H=540,TS=32;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let g=ctx;                       // current drawing context (swapped for offscreen rendering)
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s|0)+'px';cv.style.height=(H*s|0)+'px';}
addEventListener('resize',fit);fit();

const INK='#1f3c8f',PAPER='#fdfdfb',RED='#1f3c8f',SEAL='#c0392b',GREY='#5a6ea8';
const FONT='"KaiTi","STKaiti","Segoe Print","Comic Sans MS",cursive';

// ---------------------------------------------------------------- noise & rng
function hashf(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return ((h&0xffff)/0xffff)*2-1;}
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

// ---------------------------------------------------------------- ink drawing primitives
let boil=0;   // increments ~10x/sec → hand-drawn "boiling" lines
function wobblyPath(pts,closed,seed,amt){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of pts){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}_pb={x:x0-2,y:y0-2,w:x1-x0+4,h:y1-y0+4};
  g.beginPath();const n=pts.length,m=closed?n:n-1;let first=true;
  for(let k=0;k<m;k++){const a=pts[k],b=pts[(k+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;const segs=Math.max(1,Math.ceil(len/9));const nx=-dy/len,ny=dx/len;
    for(let i=0;i<segs;i++){const t=i/segs;const d=i===0?0:hashf(i+k*131,seed,boil)*amt*0.6;const px=a[0]+dx*t+nx*d,py=a[1]+dy*t+ny*d;if(first){g.moveTo(px,py);first=false;}else g.lineTo(px,py);}}
  if(closed)g.closePath();else{const e=pts[n-1];g.lineTo(e[0],e[1]);}
}
function stroke(w=2,c=INK){g.lineWidth=Math.min(w,2.2)*0.85;g.strokeStyle=c;g.lineCap='round';g.lineJoin='round';g.stroke();}
function fillPath(c){
  if(c!==INK){g.fillStyle=c;g.fill();return;}
  // ballpoint "fill": a light wash plus dense cross-hatch clipped to the shape
  g.save();g.clip();g.fillStyle='rgba(31,60,143,0.28)';g.fillRect(-4000,-4000,8000,8000);
  const b=pathBounds();g.strokeStyle=INK;g.lineWidth=1;g.lineCap='round';const hp=new Path2D();
  for(let d=-b.h;d<b.w;d+=3){hp.moveTo(b.x+d,b.y+b.h);hp.lineTo(b.x+d+b.h,b.y);}
  for(let d=0;d<b.w+b.h;d+=4){hp.moveTo(b.x+d,b.y);hp.lineTo(b.x+d-b.h,b.y+b.h);}
  g.stroke(hp);g.restore();}
let _pb={x:0,y:0,w:0,h:0};function pathBounds(){return _pb;}
function inkLine(x1,y1,x2,y2,o={}){wobblyPath([[x1,y1],[x2,y2]],false,o.seed||0,o.wob??1.1);stroke(o.w||2,o.color||INK);}
function inkCircle(cx,cy,r,seed=0,amt=0.8){const n=Math.max(8,Math.ceil(r*1.2));const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=r*(1+hashf(i,seed,boil)*0.05);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}wobblyPath(pts,true,seed,amt);}
function inkEllipse(cx,cy,rx,ry,seed=0,amt=0.6){const n=14;const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}wobblyPath(pts,true,seed,amt);}
function dot(x,y,r,c=INK){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=c;g.fill();}
function hatchRect(x,y,w,h,sp,seed,alpha=0.5,lw=1){g.save();g.globalAlpha*=alpha;for(let d=-h;d<w;d+=sp){wobblyPath([[x+d,y+h],[x+d+h,y]],false,seed+d,0.5);stroke(lw);}g.restore();}
function txt(s,x,y,size,align='center',color=INK,weight=''){g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;g.fillText(s,x,y);}
function inkText(s,x,y,size,align='center'){ // sketchy double-pass text
  g.save();g.globalAlpha=0.35;txt(s,x+1.5,y+1,size,align,INK);g.globalAlpha=1;txt(s,x,y,size,align,INK);g.restore();}
function heartPts(cx,cy,s){const p=[];for(let i=0;i<16;i++){const t=i/16*Math.PI*2;const x=16*Math.pow(Math.sin(t),3);const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));p.push([cx+x*s,cy+y*s]);}return p;}

// paper texture
const paperTex=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const q=c.getContext('2d');const r=rng(99);
  for(let i=0;i<1200;i++){q.fillStyle=`rgba(0,0,0,${0.012+r()*0.025})`;q.fillRect(r()*W,r()*H,1,1);}
  q.strokeStyle='rgba(90,130,200,0.16)';q.lineWidth=1;for(let y=30;y<H;y+=27){q.beginPath();q.moveTo(0,y+0.5);q.lineTo(W,y+0.5);q.stroke();}
  return c;})();

// ---------------------------------------------------------------- audio (synth)
let actx=null,muted=false;
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f0,f1,dur,type='square',vol=0.08,delay=0){const a=audio();if(!a||muted)return;const t=a.currentTime+delay;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol=0.1,hp=400){const a=audio();if(!a||muted)return;const n=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,n,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const gn=a.createGain();gn.gain.value=vol;s.connect(f).connect(gn).connect(a.destination);s.start();}
const SFX={
  jump:()=>tone(300,620,0.12,'square',0.05),
  djump:()=>{tone(420,840,0.12,'square',0.045);tone(640,1100,0.12,'square',0.035,0.05);},
  wjump:()=>tone(250,720,0.15,'triangle',0.07),
  land:()=>noise(0.07,0.1,200),
  dash:()=>noise(0.18,0.14,700),
  collect:()=>{tone(880,880,0.08,'sine',0.07);tone(1320,1320,0.14,'sine',0.06,0.07);},
  hurt:()=>{tone(300,70,0.45,'sawtooth',0.09);noise(0.3,0.15,100);},
  stomp:()=>{tone(220,60,0.15,'square',0.08);noise(0.1,0.1,300);},
  spring:()=>tone(200,950,0.25,'triangle',0.08),
  check:()=>[523,659,784].forEach((f,i)=>tone(f,f,0.18,'sine',0.06,i*0.08)),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.35,'triangle',0.07,i*0.12)),
  ui:()=>tone(600,600,0.05,'sine',0.05),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*0.98,0.4,'triangle',0.07,i*0.25)),
};
const SCALE=[262,294,330,392,440,523,587,659,784];let musicT=0;
function music(dt){musicT-=dt;if(musicT>0)return;musicT=0.32;if(Math.random()<0.55){const f=SCALE[Math.floor(Math.random()*SCALE.length)];tone(f,f*0.995,0.5,'sine',0.02);if(Math.random()<0.25)tone(f/2,f/2,0.9,'triangle',0.012);}}

// ---------------------------------------------------------------- input
const keys={},just={};const vkeys={left:0,right:0,jump:0,dash:0};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyK:'jump',ShiftLeft:'dash',ShiftRight:'dash',KeyX:'dash',KeyJ:'dash',KeyL:'dash',Enter:'start',KeyP:'pause',Escape:'pause',KeyR:'restart',KeyM:'mute',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k])just[k]=true;keys[k]=true;audio();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const touchEl=document.getElementById('touch');
if('ontouchstart' in window||navigator.maxTouchPoints>0){touchEl.classList.add('on');
  touchEl.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();if(!keys[k])just[k]=true;keys[k]=true;audio();};const off=e=>{e.preventDefault();keys[k]=false;};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});}
cv.addEventListener('pointerdown',()=>{audio();if(state==='title'){just.start=true;}});
const down=k=>!!keys[k], pressed=k=>!!just[k];

// ---------------------------------------------------------------- level builder
function makeLevel(name,w,h,fn){
  const t=[];for(let y=0;y<h;y++)t.push(new Array(w).fill('.'));
  const L={name,w,h,t,
    put:(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<h)t[y][x]=c;},
    fill:(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)L.put(x,y,c);},
    ground:(x0,x1,top)=>L.fill(x0,top,x1,h-1,'#'),
    plat:(x,y,n)=>L.fill(x,y,x+n-1,y,'='),
    wall:(x,y0,y1)=>L.fill(x,y0,x,y1,'#'),
    spikes:(x0,x1,y)=>L.fill(x0,y,x1,y,'^'),
    drops:(x0,x1,y)=>{for(let x=x0;x<=x1;x++)L.put(x,y,'o');},
  };
  fn(L);
  for(let x=0;x<w;x++)if(t[h-1][x]==='.')t[h-1][x]='x';
  return L;
}

    L.plat(32,11,2);L.put(33,10,'o');
    L.ground(36,50,13);L.spikes(42,43,12);L.put(40,11,'o');L.put(46,12,'C');
    L.ground(51,60,11);L.put(56,10,'E');L.drops(53,54,9);
    L.ground(61,70,13);L.put(63,12,'S');L.plat(64,7,3);L.drops(64,66,6);
    L.plat(69,9,3);L.put(70,8,'o');
    L.ground(72,86,13);L.put(78,9,'M');L.drops(75,81,11);
    L.put(89,12,'m');
    L.ground(92,111,13);L.spikes(97,98,12);L.drops(100,102,11);L.put(103,12,'E');L.put(108,12,'F');
  }),
  makeLevel('峭壁与墙',130,17,L=>{

    L.ground(19,30,9);L.put(24,8,'E');L.drops(21,22,7);

    L.put(88,8,'n');L.plat(90,4,3);L.drops(90,92,3);

    L.ground(116,129,11);L.spikes(119,120,10);L.put(126,10,'F');L.drops(122,124,9);

  makeLevel('墨海登高',140,24,L=>{

// ---------------------------------------------------------------- static layer renderer
function renderStatic(L,variant){
  const c=document.createElement('canvas');c.width=L.w*TS;c.height=L.h*TS;
  const prev=g,pb=boil;g=c.getContext('2d');boil=variant*17+3;
  const S=(x,y)=>{if(x<0||x>=L.w)return true;if(y<0)return false;if(y>=L.h)return true;return L.t[y][x]==='#';};
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
    const ch=L.t[y][x],px=x*TS,py=y*TS;
    if(ch==='#'){
      const top=!S(x,y-1),bot=!S(x,y+1),left=!S(x-1,y),right=!S(x+1,y);
      let depth=0;while(depth<3&&S(x,y-depth-1))depth++;
      g.save();g.beginPath();g.rect(px,py,TS,TS);g.clip();
      if(depth===0)hatchRect(px,py,TS,TS,6,x*31+y,0.55,1.2);
      else if(depth===1)hatchRect(px,py,TS,TS,11,x*31+y,0.4,1);
      else{const r=rng(x*7919+y*104729+variant*31);const n=Math.floor(r()*3);for(let i=0;i<n;i++){const cx=px+5+r()*22,cy=py+5+r()*22;inkCircle(cx,cy,1.5+r()*2.2,i+x,0.3);stroke(1.1);}
        if(r()<0.2){g.globalAlpha=0.35;inkLine(px+6+r()*10,py+8+r()*14,px+16+r()*10,py+10+r()*14,{w:1});g.globalAlpha=1;}}
      g.restore();
      if(top){inkLine(px,py,px+TS,py,{w:3,seed:x*3+y*7});
        const r=rng(x*131+y*17+variant*5);const n=2+Math.floor(r()*3);
        for(let i=0;i<n;i++){const gx=px+3+r()*26,h=4+r()*8,lean=(r()-0.5)*7;wobblyPath([[gx,py+1],[gx+lean,py-h]],false,i+x,0.4);stroke(1.5);}}
      if(bot)inkLine(px,py+TS,px+TS,py+TS,{w:2.2,seed:x+y*5});
      if(left)inkLine(px,py,px,py+TS,{w:2.6,seed:x*5+y});
      if(right)inkLine(px+TS,py,px+TS,py+TS,{w:2.6,seed:x*5+y+1});
    }
    else if(ch==='='){
      const lN=L.t[y][x-1]==='=',rN=L.t[y][x+1]==='=';
      wobblyPath([[px,py],[px+TS,py],[px+TS,py+9],[px,py+9]],true,x+y*9,0.5);fillPath(PAPER);
      inkLine(px,py,px+TS,py,{w:2.6,seed:x*2});inkLine(px,py+9,px+TS,py+9,{w:2,seed:x*2+1});
      if(!lN)inkLine(px,py,px,py+9,{w:2.2});if(!rN)inkLine(px+TS,py,px+TS,py+9,{w:2.2});
      g.globalAlpha=0.5;inkLine(px+5,py+4,px+18,py+4.5,{w:1,seed:x});inkLine(px+22,py+6,px+29,py+6,{w:1,seed:x+3});g.globalAlpha=1;
      if(!lN){wobblyPath([[px+5,py+9],[px+5,py+17],[px+11,py+9]],false,x,0.4);stroke(1.6);}
      if(!rN){wobblyPath([[px+27,py+9],[px+27,py+17],[px+21,py+9]],false,x+1,0.4);stroke(1.6);}
    }
    else if(ch==='^'){
      inkLine(px,py+TS-1,px+TS,py+TS-1,{w:2.2,seed:x});
      for(let i=0;i<3;i++){const bx=px+i*TS/3,bw=TS/3;wobblyPath([[bx+1,py+TS],[bx+bw/2,py+11],[bx+bw-1,py+TS]],true,x*3+i,0.6);fillPath(PAPER);stroke(2);
        g.globalAlpha=0.6;wobblyPath([[bx+3,py+29],[bx+bw/2-0.5,py+16]],false,i,0.3);stroke(1);g.globalAlpha=1;}
    }
    else if(ch==='x'){
      g.fillStyle=INK;g.beginPath();g.moveTo(px,py+TS);
      for(let i=0;i<=8;i++){const xx=px+i*4;g.lineTo(xx,py+12+Math.sin(xx/9+variant)*2.2+Math.sin(xx/23)*1.5);}
      g.lineTo(px+TS,py+TS);g.closePath();_pb={x:px,y:py+8,w:TS,h:TS-8};fillPath(INK);
      g.globalAlpha=0.35;g.strokeStyle=PAPER;g.lineWidth=1.2;g.beginPath();for(let i=0;i<=8;i++){const xx=px+i*4;const yy=py+19+Math.sin(xx/7+variant*2)*1.5;i?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();g.globalAlpha=1;
    }
  }
  g=prev;boil=pb;return c;
}

// ---------------------------------------------------------------- game state
let state='title',stateT=0,time=0;
let lvl=null,lvlIndex=0,statics=[],ents=null,player=null,cam={x:0,y:0,shake:0},parts=[];
let lives=3,levelTime=0,totalDrops=0,gotDrops=0,runTotalTime=0,runTotalDrops=0,runTotalGot=0;
let trans=null,hills=[],clouds=[],birds=[],poolTiles=[];
const PC={run:205,acc:1500,dec:2100,airAcc:1150,grav:1400,jump:470,fallMax:640,coyote:0.1,buffer:0.12,wallSlide:75,wallJumpX:245,wallJumpY:440,dashSpeed:520,dashTime:0.16};

function loadLevel(i){
  lvlIndex=i;const src=LEVELS[i];lvl={name:src.name,w:src.w,h:src.h,t:src.t.map(r=>r.slice())};
  ents={drops:[],enemies:[],movers:[],springs:[],checks:[],flag:null};poolTiles=[];
  let spawn={x:64,y:64};let id=0;
  for(let y=0;y<lvl.h;y++)for(let x=0;x<lvl.w;x++){const c=lvl.t[y][x];const px=x*TS,py=y*TS;
    if(c==='x')poolTiles.push([px,py]);
    if('PEMmnSCFo'.includes(c)){lvl.t[y][x]='.';
      if(c==='P')spawn={x:px+6,y:py+4};
      else if(c==='o')ents.drops.push({x:px,y:py,id:id++,ph:Math.random()*6,got:false});
      else if(c==='E')ents.enemies.push({type:'walker',x:px+3,y:py+10,w:26,h:22,dir:-1,speed:48,alive:true,id:id++,t:Math.random()*5});
      else if(c==='M')ents.enemies.push({type:'moth',x0:px+4,y0:py+4,x:px+4,y:py+4,w:24,h:20,dir:1,alive:true,id:id++,ph:Math.random()*6});
      else if(c==='m')ents.movers.push({type:'h',x0:px+16-32,y0:py+10,x:px-16,y:py+10,w:64,h:10,dx:0,dy:0,id:id++,ph:Math.random()*6});
      else if(c==='n')ents.movers.push({type:'v',x0:px+16-32,y0:py+10,x:px-16,y:py+10,w:64,h:10,dx:0,dy:0,id:id++,ph:Math.random()*6});
      else if(c==='S')ents.springs.push({x:px,y:py+5,w:32,h:27,comp:0,id:id++});
      else if(c==='C')ents.checks.push({x:px,y:py,active:false,id:id++});
      else if(c==='F')ents.flag={x:px,y:py,w:40,h:80};
    }}
  totalDrops=ents.drops.length;gotDrops=0;levelTime=0;
  statics=[renderStatic(lvl,0)];
  player={x:spawn.x,y:spawn.y,w:20,h:28,vx:0,vy:0,face:1,sx:1,sy:1,onGround:false,wasGround:false,wallDir:0,coyote:0,buffer:0,canDouble:true,canDash:true,dashT:0,dashCd:0,wallLock:0,
    anim:'idle',runPhase:0,dead:false,deadT:0,invuln:0,spawn:{...spawn},ride:null,ghostT:0,sliding:false,idleT:0,lastVy:0};
  cam.x=clamp(player.x-W/2,0,lvl.w*TS-W);cam.y=clamp(player.y-H*0.6,0,Math.max(0,lvl.h*TS-H));parts=[];
  // parallax décor
  hills=[0.22,0.42,0.65].map((f,li)=>{const len=lvl.w*TS*f+W+300;const pts=[];for(let x=0;x<=len;x+=36){const i=x/36;pts.push([x,-(0.5+0.5*Math.sin(i*0.33+li*2))*(40+li*35)-18*Math.sin(i*0.9+li*3)-8*Math.sin(i*2.1+li)]);}return{f,pts,base:H*(0.56+li*0.1),len};});
  const r=rng(i*77+5);clouds=[];for(let k=0;k<5;k++)clouds.push({x:r()*(lvl.w*TS*0.15+W),y:40+r()*150,s:0.7+r()*0.9,ph:r()*6});
  birds=[];for(let k=0;k<2;k++)birds.push({x:r()*W*2,y:60+r()*120,ph:r()*6,sp:20+r()*20});
}

function startTransition(cx,cy,onMid){trans={t:0,dur:1.1,cx,cy,onMid,mid:false};}

function hurt(){const p=player;if(p.dead||p.invuln>0||state!=='play')return;
  p.dead=true;p.deadT=1.1;lives--;cam.shake=8;SFX.hurt();
  spawn('splat',p.x+p.w/2,p.y+p.h/2,12,{spd:220,size:4,grav:700,life:1.0});}

// ---------------------------------------------------------------- particles
function spawn(type,x,y,n,o={}){for(let i=0;i<n;i++){const a=o.dir!=null?o.dir+(Math.random()-0.5)*(o.spread||1.2):Math.random()*Math.PI*2;const sp=(o.spd||100)*(0.3+Math.random()*0.7);
  parts.push({type,x,y,vx:Math.cos(a)*sp+(o.vx||0),vy:Math.sin(a)*sp+(o.vy||0),life:(o.life||0.6)*(0.6+Math.random()*0.5),max:1,size:(o.size||4)*(0.6+Math.random()*0.8),seed:Math.floor(Math.random()*1000),grav:o.grav||0,face:o.face||1});
  parts[parts.length-1].max=parts[parts.length-1].life;}}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;if(p.type==='dust'){p.vx*=0.9;p.vy*=0.9;}}}
function drawParts(){for(const p of parts){const k=p.life/p.max;g.save();
  if(p.type==='dust'){g.globalAlpha=k*0.55;inkCircle(p.x,p.y,p.size*(1.6-k*0.6),p.seed,0.5);stroke(1.4,GREY);}
  else if(p.type==='splat'){g.globalAlpha=Math.min(1,k*2);inkCircle(p.x,p.y,p.size*(0.4+k*0.6),p.seed,0.7);fillPath(INK);}
  else if(p.type==='spark'){g.globalAlpha=k;inkLine(p.x,p.y,p.x-p.vx*0.06,p.y-p.vy*0.06,{w:1.8,seed:p.seed});}
  else if(p.type==='ring'){g.globalAlpha=k*0.8;inkCircle(p.x,p.y,p.size*(1.3-k),p.seed,1.2);stroke(2);}
  else if(p.type==='ghost'){g.globalAlpha=k*0.35;g.translate(p.x,p.y);g.scale(p.face,1);g.rotate(0.5);inkEllipse(0,-11,6,10,p.seed,0.6);fillPath(INK);inkCircle(0,-24,7,p.seed+1,0.6);fillPath(INK);}
  else if(p.type==='drip'){g.globalAlpha=Math.min(1,k*3);dot(p.x,p.y,p.size*0.5);}
  else if(p.type==='red'){g.globalAlpha=k;inkCircle(p.x,p.y,p.size*k,p.seed,0.6);fillPath(RED);}
  g.restore();}}

// ---------------------------------------------------------------- physics helpers
function tileAt(tx,ty){if(tx<0||tx>=lvl.w)return '#';if(ty<0||ty>=lvl.h)return '.';return lvl.t[ty][tx];}
const solid=c=>c==='#';
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function updatePlayer(dt){
  const p=player;
  if(p.dead){p.deadT-=dt;if(p.deadT<=0){if(lives<=0){state='over';stateT=0;SFX.over();}else{p.x=p.spawn.x;p.y=p.spawn.y;p.vx=0;p.vy=0;p.dead=false;p.invuln=1.6;p.ride=null;p.dashT=0;p.canDouble=p.canDash=true;spawn('ring',p.x+10,p.y+14,1,{size:30,life:0.5});spawn('splat',p.x+10,p.y+14,8,{spd:90,size:3,life:0.5});}}return;}
  p.invuln=Math.max(0,p.invuln-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.wallLock=Math.max(0,p.wallLock-dt);
  const dir=(down('right')?1:0)-(down('left')?1:0);
  // ride mover
  if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy;}
  // wall contact probe
  let wallDir=0;{const ty0=Math.floor(p.y/TS),ty1=Math.floor((p.y+p.h-1)/TS);const rx=Math.floor((p.x+p.w+1)/TS),lx=Math.floor((p.x-1)/TS);
    for(let ty=ty0;ty<=ty1;ty++){if(solid(tileAt(rx,ty)))wallDir=1;else if(solid(tileAt(lx,ty)))wallDir=-1;}}
  p.wallDir=wallDir;
  p.sliding=!p.onGround&&wallDir!==0&&dir===wallDir&&p.vy>0&&p.dashT<=0;
  // horizontal
  if(p.dashT>0){p.dashT-=dt;p.vy=0;p.ghostT-=dt;if(p.ghostT<=0){p.ghostT=0.035;spawn('ghost',p.x+p.w/2,p.y+p.h,1,{spd:0,life:0.3,face:p.face});}
    if(p.dashT<=0){p.vx=p.face*PC.run;}}
  else{
    if(p.wallLock<=0){
      if(dir!==0){const acc=p.onGround?PC.acc:PC.airAcc;p.vx+=dir*acc*dt;if(Math.sign(p.vx)!==dir&&p.onGround)p.vx+=dir*PC.dec*dt*0.5;p.face=dir;}
      else{const dec=(p.onGround?PC.dec:PC.airAcc*0.6)*dt;if(Math.abs(p.vx)<=dec)p.vx=0;else p.vx-=Math.sign(p.vx)*dec;}}
    p.vx=clamp(p.vx,-PC.run,PC.run);
    if(p.sliding)p.face=wallDir;
  }
  // jump logic
  p.coyote=p.onGround?PC.coyote:Math.max(0,p.coyote-dt);
  if(pressed('jump'))p.buffer=PC.buffer;else p.buffer=Math.max(0,p.buffer-dt);
  if(p.buffer>0&&p.dashT<=0){
    if(p.coyote>0){p.vy=-PC.jump;p.jumpCut=true;p.coyote=0;p.buffer=0;p.onGround=false;p.ride=null;p.sx=0.72;p.sy=1.3;SFX.jump();spawn('dust',p.x+p.w/2,p.y+p.h,5,{spd:60,size:4,life:0.4});}
    else if(wallDir!==0){p.vy=-PC.wallJumpY;p.jumpCut=true;p.vx=-wallDir*PC.wallJumpX;p.face=-wallDir;p.wallLock=0.16;p.buffer=0;p.canDash=true;p.sx=0.7;p.sy=1.3;SFX.wjump();spawn('dust',p.x+(wallDir>0?p.w:0),p.y+p.h*0.6,6,{spd:80,size:3.5,life:0.4,dir:wallDir>0?Math.PI:0,spread:1.5});}
    else if(p.canDouble){p.vy=-PC.jump*0.92;p.jumpCut=true;p.canDouble=false;p.buffer=0;p.sx=0.75;p.sy=1.25;SFX.djump();spawn('ring',p.x+p.w/2,p.y+p.h-2,1,{size:22,life:0.35});spawn('dust',p.x+p.w/2,p.y+p.h,4,{spd:50,size:3,life:0.35});}
  }
  if(!down('jump')&&p.vy<-160&&p.dashT<=0&&p.jumpCut)p.vy=-160;  // variable jump height (only for player-initiated jumps)
  // dash
  if(pressed('dash')&&p.canDash&&p.dashT<=0&&p.dashCd<=0){p.dashT=PC.dashTime;p.dashCd=0.35;p.canDash=false;if(dir!==0)p.face=dir;p.vx=p.face*PC.dashSpeed;p.vy=0;p.ride=null;p.sx=1.35;p.sy=0.75;SFX.dash();}
  // gravity
  if(p.dashT<=0){p.vy+=PC.grav*dt;if(p.sliding)p.vy=Math.min(p.vy,PC.wallSlide);p.vy=Math.min(p.vy,PC.fallMax);}
  // ---- move X
  let nx=p.x+p.vx*dt;{const ty0=Math.floor(p.y/TS),ty1=Math.floor((p.y+p.h-0.01)/TS);
    if(p.vx>0){const tx=Math.floor((nx+p.w)/TS);for(let ty=ty0;ty<=ty1;ty++)if(solid(tileAt(tx,ty))){nx=tx*TS-p.w-0.001;p.vx=0;if(p.dashT>0)p.dashT=0;break;}}
    else if(p.vx<0){const tx=Math.floor(nx/TS);for(let ty=ty0;ty<=ty1;ty++)if(solid(tileAt(tx,ty))){nx=(tx+1)*TS+0.001;p.vx=0;if(p.dashT>0)p.dashT=0;break;}}}
  p.x=nx;
  // ---- move Y
  const prevBottom=p.y+p.h;let ny=p.y+p.vy*dt;p.wasGround=p.onGround;p.onGround=false;
  {const tx0=Math.floor(p.x/TS),tx1=Math.floor((p.x+p.w-0.01)/TS);
    if(p.vy>=0){const ty=Math.floor((ny+p.h)/TS);for(let tx=tx0;tx<=tx1;tx++){const c=tileAt(tx,ty);if(solid(c)||(c==='='&&prevBottom<=ty*TS+0.6&&!(down('down')&&pressed('jump')))){ny=ty*TS-p.h;p.vy=0;p.onGround=true;break;}}}
    else{const ty=Math.floor(ny/TS);for(let tx=tx0;tx<=tx1;tx++)if(solid(tileAt(tx,ty))){ny=(ty+1)*TS+0.001;p.vy=0;break;}}}
  p.y=ny;
  // movers
  let rode=null;
  for(const m of ents.movers){if(p.vy>=0&&p.x<m.x+m.w&&p.x+p.w>m.x&&p.y+p.h>=m.y-0.5&&prevBottom<=m.y+6&&p.y+p.h<=m.y+m.h+8){p.y=m.y-p.h;p.vy=0;p.onGround=true;rode=m;}}
  p.ride=rode;
  // springs
  for(const s of ents.springs){s.comp=Math.max(0,s.comp-dt*3);if(p.vy>=0&&overlap(p,s)&&prevBottom<=s.y+12){p.y=s.y-p.h;p.vy=-810;p.jumpCut=false;p.onGround=false;p.canDouble=true;p.canDash=true;s.comp=1;p.sx=0.6;p.sy=1.5;SFX.spring();spawn('dust',s.x+16,s.y+20,8,{spd:80,size:4,life:0.5});}}
  // landing
  if(p.onGround){p.canDouble=true;p.canDash=true;if(!p.wasGround){const impact=Math.min(1,p.lastVy/600);p.sx=1+0.35*impact;p.sy=1-0.3*impact;if(p.lastVy>180){SFX.land();spawn('dust',p.x+p.w/2,p.y+p.h,3+Math.floor(impact*6),{spd:70+impact*60,size:4,life:0.45});if(p.lastVy>500)cam.shake=Math.max(cam.shake,3);}}}
  p.lastVy=p.vy;
  // hazards
  const hb={x:p.x+3,y:p.y+3,w:p.w-6,h:p.h-6};
  {const tx0=Math.floor(hb.x/TS),tx1=Math.floor((hb.x+hb.w)/TS),ty0=Math.floor(hb.y/TS),ty1=Math.floor((hb.y+hb.h)/TS);
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const c=tileAt(tx,ty);if(c==='^'||c==='x'){const hz={x:tx*TS+3,y:ty*TS+13,w:26,h:19};if(overlap(hb,hz)){hurt();if(c==='x')spawn('splat',p.x+p.w/2,ty*TS+12,10,{spd:150,size:4,grav:600,life:0.8,dir:-Math.PI/2,spread:1.6});}}}}
  if(p.y>lvl.h*TS+60)hurt();
  // drops
  for(const d of ents.drops){if(!d.got&&overlap(p,{x:d.x+8,y:d.y+4,w:16,h:24})){d.got=true;gotDrops++;SFX.collect();spawn('spark',d.x+16,d.y+16,10,{spd:160,life:0.4});spawn('ring',d.x+16,d.y+16,1,{size:18,life:0.3});}}
  // enemies
  for(const e of ents.enemies){if(!e.alive)continue;if(overlap(p,e)){
    if(p.vy>0&&p.y+p.h-e.y<16||p.dashT>0){e.alive=false;p.vy=-330;p.jumpCut=false;p.canDouble=true;p.canDash=true;p.sx=0.8;p.sy=1.2;SFX.stomp();cam.shake=Math.max(cam.shake,3);
      spawn('splat',e.x+e.w/2,e.y+e.h/2,9,{spd:170,size:4,grav:600,life:0.8});}
    else hurt();}}
  // checkpoints
  for(const c of ents.checks){if(!c.active&&overlap(p,{x:c.x,y:c.y-16,w:32,h:48})){c.active=true;p.spawn={x:c.x+6,y:c.y-4};SFX.check();spawn('ring',c.x+16,c.y+16,2,{size:30,life:0.6});spawn('red',c.x+16,c.y+10,10,{spd:90,size:3,life:0.7,grav:300});}}
  // flag
  if(ents.flag&&overlap(p,{x:ents.flag.x,y:ents.flag.y-48,w:40,h:80})){state='clear';stateT=0;SFX.win();runTotalTime+=levelTime;runTotalDrops+=totalDrops;runTotalGot+=gotDrops;cam.shake=4;
    for(let i=0;i<3;i++)spawn('red',ents.flag.x+20,ents.flag.y-20,12,{spd:160,size:4,life:1.2,grav:250});spawn('spark',p.x+p.w/2,p.y,16,{spd:220,life:0.6});}
  // anim state
  p.sx=lerp(p.sx,1,Math.min(1,dt*10));p.sy=lerp(p.sy,1,Math.min(1,dt*10));
  if(p.dashT>0)p.anim='dash';else if(!p.onGround)p.anim=p.sliding?'wall':p.vy<0?'jump':'fall';else p.anim=Math.abs(p.vx)>25?'run':'idle';
  if(p.anim==='run'){p.runPhase+=Math.abs(p.vx)*dt*0.085;}
}

function updateEnemies(dt){
  for(const e of ents.enemies){if(!e.alive)continue;e.t=(e.t||0)+dt;
    if(e.type==='walker'){const nx=e.x+e.dir*e.speed*dt;const fx=e.dir>0?nx+e.w:nx;const ty=Math.floor((e.y+e.h-1)/TS);const tx=Math.floor(fx/TS);
      const below=tileAt(tx,Math.floor((e.y+e.h+2)/TS));const ahead=tileAt(tx,ty);
      if(solid(ahead)||!(solid(below)||below==='=')||tx<0||tx>=lvl.w)e.dir*=-1;else e.x=nx;}
    else{e.x=e.x0+Math.sin(time*0.9+e.ph)*64;e.y=e.y0+Math.sin(time*1.8+e.ph)*48;e.dir=Math.cos(time*0.9+e.ph)>0?1:-1;}}
  for(const m of ents.movers){const ox=m.x,oy=m.y;if(m.type==='h')m.x=m.x0+Math.sin(time*1.25+m.ph)*48;else m.y=m.y0+Math.sin(time*1.0+m.ph)*80;m.dx=m.x-ox;m.dy=m.y-oy;}
}

function updateCamera(dt){const p=player;const tx=clamp(p.x+p.w/2-W/2+p.face*50+p.vx*0.12,0,Math.max(0,lvl.w*TS-W));const ty=clamp(p.y+p.h/2-H*0.58,0,Math.max(0,lvl.h*TS-H));
  cam.x+=(tx-cam.x)*Math.min(1,dt*5);cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);cam.shake=Math.max(0,cam.shake-dt*30);}

// ---------------------------------------------------------------- update
let boilT=0;
function update(dt){
  time+=dt;stateT+=dt;boilT+=dt;if(boilT>0.33){boilT=0;boil++;}
  if(trans){trans.t+=dt;if(!trans.mid&&trans.t>=trans.dur/2){trans.mid=true;trans.onMid();}if(trans.t>=trans.dur)trans=null;just.jump=just.start=false;}
  if(pressed('mute')){muted=!muted;SFX.ui();}
  if(state==='title'){if((pressed('jump')||pressed('start'))&&!trans){SFX.ui();lives=3;runTotalTime=runTotalDrops=runTotalGot=0;startTransition(W/2,H/2,()=>{loadLevel(0);state='play';stateT=0;});}}
  else if(state==='play'){
    if(pressed('pause')){state='pause';SFX.ui();}
    else{levelTime+=dt;updateEnemies(dt);updatePlayer(dt);updateCamera(dt);updateParts(dt);music(dt);
      if(pressed('restart')&&!trans){SFX.ui();startTransition(player.x+10-cam.x,player.y+14-cam.y,()=>{lives=3;loadLevel(lvlIndex);state='play';stateT=0;});}}
  }
  else if(state==='pause'){if(pressed('pause')||pressed('jump')){state='play';SFX.ui();}}
  else if(state==='clear'){updateEnemies(dt);updateParts(dt);updateCamera(dt);player.sx=lerp(player.sx,1,dt*10);player.sy=lerp(player.sy,1,dt*10);player.anim='idle';
    if(stateT>0.8&&(pressed('jump')||pressed('start'))&&!trans){SFX.ui();const next=lvlIndex+1;startTransition(player.x+10-cam.x,player.y+14-cam.y,()=>{if(next<LEVELS.length){loadLevel(next);state='play';}else{state='win';}stateT=0;});}}
  else if(state==='over'){updateParts(dt);if(stateT>0.8&&(pressed('jump')||pressed('restart')||pressed('start'))&&!trans){SFX.ui();startTransition(W/2,H/2,()=>{lives=3;loadLevel(lvlIndex);state='play';stateT=0;});}}
  else if(state==='win'){if(stateT>1&&(pressed('jump')||pressed('start'))&&!trans){SFX.ui();startTransition(W/2,H/2,()=>{state='title';stateT=0;});}}
  for(const k in just)just[k]=false;
}

// ---------------------------------------------------------------- drawing: world
function drawBackground(){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);g.drawImage(paperTex,0,0);
  const camY=cam.y-(Math.max(0,lvl?lvl.h*TS-H:0));
  // sun
  {const sx=W*0.8-cam.x*0.04,sy=85-camY*0.05;g.save();g.globalAlpha=0.85;inkCircle(sx,sy,30,500,1.6);stroke(2.2);g.globalAlpha=0.5;inkCircle(sx+2,sy+1,27,501,2);stroke(1.2);
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;const r1=38,r2=r1+8+(i%3)*5;inkLine(sx+Math.cos(a)*r1,sy+Math.sin(a)*r1,sx+Math.cos(a)*r2,sy+Math.sin(a)*r2,{w:1.4,seed:i});}g.restore();}
  // clouds
  for(const c of clouds){const span=lvl.w*TS*0.15+W+200;let x=((c.x-cam.x*0.15+time*2)%span+span)%span-100;const y=c.y-camY*0.1;
    g.save();g.translate(x,y);g.scale(c.s,c.s);g.globalAlpha=0.7;
    const bl=[[0,0,22],[24,-10,26],[52,-4,20],[-20,4,14]];for(const [bx,by,r] of bl){inkEllipse(bx,by,r,r*0.6,c.ph*100+bx,1.5);fillPath(PAPER);}
    for(const [bx,by,r] of bl){inkEllipse(bx,by,r,r*0.6,c.ph*100+bx,1.5);stroke(1.6);}
    g.globalAlpha=0.3;inkLine(-28,10,70,10,{w:1.2});g.restore();}
  // birds
  for(const b of birds){const x=((b.x+time*b.sp-cam.x*0.3)%(W+200)+W+200)%(W+200)-100;const y=b.y-camY*0.15+Math.sin(time*2+b.ph)*6;const f=Math.sin(time*9+b.ph)*4;
    wobblyPath([[x-7,y-f],[x,y+2],[x+7,y-f]],false,b.ph*10,0.3);stroke(1.6);}
  // hills
  hills.forEach((hl,li)=>{const ox=-cam.x*hl.f;const oy=hl.base-camY*hl.f*0.5;const pts=[];
    for(let i=0;i<hl.pts.length;i++){const x=hl.pts[i][0]+ox;if(x<-50||x>W+50)continue;pts.push([x,hl.pts[i][1]+oy]);}
    if(pts.length<2)return;g.save();g.globalAlpha=1;
    g.beginPath();wobblyPath(pts,false,li*77,1.0);g.lineTo(pts[pts.length-1][0],H+10);g.lineTo(pts[0][0],H+10);g.closePath();fillPath(PAPER);
    g.clip();g.globalAlpha=0.25+li*0.12;
    for(let i=0;i<pts.length-1;i++){const [x,y]=pts[i];const d=22+li*14;for(let k=0;k<3;k++){const xx=x+k*12+(li*5);inkLine(xx,y+2+k*2,xx-8+li*4,y+d-k*4,{w:1,seed:i*3+k,wob:0.6});}}
    g.restore();g.globalAlpha=0.85-li*0.15;wobblyPath(pts,false,li*77,1.0);stroke(2.2-li*0.3);g.globalAlpha=1;});
}

function drawScarf(p){const t=time;const n=6;const pts=[[-2,-16]];const sp=Math.abs(p.vx)/PC.run;const up=clamp(-p.vy*0.004,-1.2,1.2);
  for(let i=1;i<=n;i++){pts.push([-2-i*(4+sp*1.5),-16+Math.sin(t*12-i*0.9)*(1.8+sp)+i*i*0.35*up+(p.anim==='idle'?i*0.9:0)]);}
  wobblyPath(pts,false,88,0.6);stroke(6,INK);wobblyPath(pts,false,88,0.6);g.lineWidth=3.6;g.strokeStyle=SEAL;g.stroke();}

function drawPlayer(p){
  if(p.dead)return;if(p.invuln>0&&Math.floor(time*16)%2===0)return;
  const t=time,s=p.anim,ph=p.runPhase;
  g.save();g.translate(p.x+p.w/2,p.y+p.h);g.scale(p.face*p.sx,p.sy);
  let lean=0,bob=0,headY=-22;
  let footL=[-4,0],footR=[4,0],handL=[-6,-9],handR=[6,-9];
  if(s==='idle'){bob=Math.sin(t*3)*0.8;handL=[-6,-8+Math.sin(t*3)*0.5];handR=[6,-8+Math.sin(t*3+1)*0.5];}
  else if(s==='run'){lean=0.17;const c=Math.cos(ph),sn=Math.sin(ph);footL=[sn*7,-Math.max(0,c)*5];footR=[-sn*7,-Math.max(0,-c)*5];handL=[-sn*6,-10-Math.abs(c)];handR=[sn*6,-10];bob=-Math.abs(sn)*1.6;}
  else if(s==='jump'){footL=[-3,-4];footR=[5,-2];handL=[-7,-19];handR=[7,-17];lean=0.1;}
  else if(s==='fall'){footL=[-5,-1];footR=[5,-3];handL=[-9,-20+Math.sin(t*25)*2];handR=[8,-19+Math.cos(t*25)*2];lean=-0.05;}
  else if(s==='wall'){footL=[-2,-2];footR=[6,-1];handL=[-5,-10];handR=[10,-15];lean=-0.12;}
  else if(s==='dash'){lean=0.55;footL=[-8,-2];footR=[-3,-1];handL=[9,-12];handR=[7,-15];headY=-19;}
  g.rotate(lean);g.translate(0,bob);
  if(s==='dash'){g.save();g.globalAlpha=0.5;for(let i=0;i<3;i++)inkLine(-14,-8-i*6,-34-i*5,-8-i*6,{w:1.5,seed:i});g.restore();}
  drawScarf(p);
  // legs
  wobblyPath([[-3,-6],footL],false,1,0.6);stroke(2.7);wobblyPath([[3,-6],footR],false,2,0.6);stroke(2.7);
  // body
  wobblyPath([[-5,-17],[5,-17],[6.5,-6],[-6.5,-6]],true,3,0.8);fillPath(PAPER);stroke(2.4);
  g.save();g.globalAlpha=0.5;inkLine(-4,-9,-2,-15,{w:1,seed:4});inkLine(-1,-8,1,-14,{w:1,seed:5});g.restore();
  // arms
  wobblyPath([[-4,-15],handL],false,6,0.6);stroke(2.4);wobblyPath([[4,-15],handR],false,7,0.6);stroke(2.4);
  // head
  inkCircle(0,headY,7.6,8,0.5);fillPath(PAPER);stroke(2.6);
  wobblyPath([[-3,headY-6.5],[-1,headY-11],[3,headY-8]],false,9,0.5);stroke(2);
  wobblyPath([[2,headY-7],[5,headY-10.5]],false,10,0.5);stroke(1.6);
  // eyes
  if(s==='dash'){inkLine(2,headY-1,5.5,headY-1.5,{w:1.8});}
  else{const blink=Math.sin(t*1.7)>0.985||(s==='idle'&&Math.sin(t*0.7)>0.995);if(blink){inkLine(1.5,headY-1,4,headY-1,{w:1.6});inkLine(5,headY-1.5,7,headY-1.5,{w:1.6});}else{dot(2.6,headY-1,1.5);dot(5.8,headY-1.5,1.4);}}
  g.restore();
}

function drawWalker(e){g.save();g.translate(e.x+e.w/2,e.y+e.h);g.scale(e.dir,1);
  for(let i=0;i<2;i++){const fx=i?7:-7;const off=Math.sin(e.t*8+i*Math.PI)*3;wobblyPath([[fx,-5],[fx+off,0]],false,30+i+e.id,0.5);stroke(2.6);}
  const pts=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;const r=1+hashf(i,e.id,0)*0.1;pts.push([Math.cos(a)*13*r,-11+Math.sin(a)*9.5*r]);}
  wobblyPath(pts,true,31+e.id,1.3);fillPath(INK);stroke(1.8);
  for(let i=0;i<3;i++){const x=-8+i*6;wobblyPath([[x,-19],[x+2,-24],[x+4,-19]],false,33+i,0.5);stroke(2.2);}
  dot(4,-13,2.8,PAPER);dot(9,-12,2.3,PAPER);dot(5,-13,1.2);dot(9.6,-12,1);
  g.strokeStyle=PAPER;g.lineWidth=1.4;g.beginPath();g.moveTo(2,-17);g.lineTo(7,-15.5);g.stroke();
  g.restore();}
function drawMoth(e){g.save();g.translate(e.x+e.w/2,e.y+e.h/2);const flap=0.45+Math.abs(Math.sin(time*9+e.ph))*0.6;
  for(const sgn of[-1,1]){g.save();g.scale(sgn*flap,1);wobblyPath([[2,0],[14,-10],[17,-2],[13,7],[3,5]],true,40+e.id,0.8);fillPath(PAPER);stroke(1.8);
    g.globalAlpha=0.6;inkLine(6,-2,12,-7,{w:1});inkLine(7,3,12,1,{w:1});g.globalAlpha=1;dot(11,-3,1.6);g.restore();}
  wobblyPath([[0,-6],[2.5,6],[-2.5,6]],true,41,0.5);fillPath(INK);
  wobblyPath([[0,-6],[-4,-12]],false,42,0.4);stroke(1.3);wobblyPath([[0,-6],[4,-12]],false,43,0.4);stroke(1.3);
  g.restore();}
function drawSpring(s){g.save();g.translate(s.x+16,s.y+27);const h=19*(1-s.comp*0.65);
  wobblyPath([[-12,0],[12,0],[12,-3],[-12,-3]],true,50,0.4);fillPath(INK);
  const pts=[];for(let i=0;i<=6;i++)pts.push([i%2?8:-8,-3-h*i/6]);wobblyPath(pts,false,51,0.4);stroke(2.2);
  wobblyPath([[-13,-3-h],[13,-3-h],[13,-8-h],[-13,-8-h]],true,52,0.5);fillPath(PAPER);stroke(2.4);
  g.restore();}
function drawDrop(d){if(d.got)return;const bob=Math.sin(time*3+d.ph)*3;g.save();g.translate(d.x+16,d.y+16+bob);
  g.globalAlpha=0.25;inkEllipse(0,14-bob*0.4,7,2,60,0.3);stroke(1.2);g.globalAlpha=1;
  wobblyPath([[0,-11],[6,-2],[6,4],[0,9],[-6,4],[-6,-2]],true,61+d.id,0.7);fillPath(INK);stroke(1.8);dot(-2.5,1,1.6,PAPER);
  g.restore();}
function drawCheckpoint(c){g.save();g.translate(c.x+16,c.y+32);
  wobblyPath([[-10,0],[10,0],[11,-12],[6,-16],[6,-20],[-6,-20],[-6,-16],[-11,-12]],true,70+c.id,0.6);fillPath(PAPER);stroke(2.4);
  if(c.active){wobblyPath([[-9,-2],[9,-2],[10,-10],[-10,-10]],true,71,0.6);fillPath(INK);
    wobblyPath([[2,-20],[13,-44]],false,72,0.6);stroke(2.2);wobblyPath([[6,-28],[11,-40],[19,-46],[16,-33]],true,73,0.8);fillPath(PAPER);stroke(1.8);}
  else{g.save();g.beginPath();g.rect(-10,-16,20,16);g.clip();hatchRect(-10,-16,20,16,5,70,0.3,1);g.restore();}
  g.restore();}
function drawFlag(f){g.save();g.translate(f.x+8,f.y+32);
  wobblyPath([[0,0],[0,-82]],false,80,0.6);stroke(3);dot(0,-84,3);
  const pts=[[0,-78]];for(let i=1;i<=4;i++)pts.push([i*9,-78+Math.sin(time*6-i*0.8)*3]);for(let i=4;i>=1;i--)pts.push([i*9,-54+Math.sin(time*6-i*0.8+0.5)*3]);pts.push([0,-54]);
  wobblyPath(pts,true,81,0.8);fillPath(RED);stroke(2.2);
  wobblyPath([[-10,0],[10,0],[8,-5],[-8,-5]],true,82,0.5);fillPath(INK);
  g.restore();}
function drawMover(m){g.save();g.translate(m.x,m.y);
  if(m.type==='v'){const top=(m.y0-120)-m.y;g.globalAlpha=0.6;inkLine(32,0,32,top,{w:1.3,seed:m.id});g.globalAlpha=1;inkCircle(32,top,4,92+m.id,0.5);fillPath(INK);}
  wobblyPath([[0,0],[64,0],[62,10],[2,10]],true,90+m.id,0.6);fillPath(PAPER);stroke(2.4);
  g.globalAlpha=0.5;for(let i=0;i<6;i++)inkLine(8+i*10,2,4+i*10,8,{w:1,seed:i});g.globalAlpha=1;
  if(m.type==='h'){for(const wx of[10,54]){inkCircle(wx,13,4,91+wx,0.5);stroke(1.6);inkLine(wx,13,wx+Math.cos(time*6)*3,13+Math.sin(time*6)*3,{w:1.2});}}
  g.restore();}

function drawWorld(){
  const sx=(Math.random()-0.5)*cam.shake*2,sy=(Math.random()-0.5)*cam.shake*2;
  g.save();g.translate(-Math.round(cam.x+sx),-Math.round(cam.y+sy));
  g.drawImage(statics[0],0,0);
  for(const m of ents.movers)drawMover(m);
  for(const s of ents.springs)drawSpring(s);
  for(const c of ents.checks)drawCheckpoint(c);
  if(ents.flag)drawFlag(ents.flag);
  for(const d of ents.drops)drawDrop(d);
  for(const e of ents.enemies)if(e.alive)(e.type==='walker'?drawWalker:drawMoth)(e);
  drawPlayer(player);drawParts();
  g.restore();
}

// ---------------------------------------------------------------- drawing: UI
function drawBorder(){g.save();g.globalAlpha=0.8;wobblyPath([[8,8],[W-8,8],[W-8,H-8],[8,H-8]],true,999,1.4);stroke(2.4);g.globalAlpha=0.3;wobblyPath([[12,12],[W-12,12],[W-12,H-12],[12,H-12]],true,998,1.2);stroke(1);g.restore();}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return `${m}:${s<10?'0':''}${s}`;}
function drawHUD(){
  for(let i=0;i<3;i++){const x=40+i*32,y=36;const pts=heartPts(x,y,0.75);wobblyPath(pts,true,700+i,0.8);if(i<lives){fillPath(INK);stroke(2);}else{g.save();g.globalAlpha=0.35;stroke(1.6);g.restore();}}
  // drop counter
  g.save();g.translate(W-120,36);wobblyPath([[0,-9],[5,-2],[5,3],[0,7.5],[-5,3],[-5,-2]],true,710,0.6);fillPath(INK);g.restore();
  inkText(`${gotDrops} / ${totalDrops}`,W-104,36,24,'left');
  inkText(fmt(levelTime),W/2,34,22);
  g.save();g.globalAlpha=0.75;txt(`第${['一','二','三'][lvlIndex]}章 · ${lvl.name}`,W/2,58,16);g.restore();
  // ability hints
  g.save();g.globalAlpha=0.5;const p=player;txt(p.canDouble?'◎':'○',40,H-30,16,'left');txt(p.canDash?'◆':'◇',62,H-30,16,'left');g.restore();
}
function overlayBox(w,h){g.save();g.globalAlpha=0.9;wobblyPath([[W/2-w/2,H/2-h/2],[W/2+w/2,H/2-h/2],[W/2+w/2,H/2+h/2],[W/2-w/2,H/2+h/2]],true,800,2);fillPath(PAPER);stroke(3);
  g.globalAlpha=0.5;wobblyPath([[W/2-w/2+6,H/2-h/2+6],[W/2+w/2-6,H/2-h/2+6],[W/2+w/2-6,H/2+h/2-6],[W/2-w/2+6,H/2+h/2-6]],true,801,1.5);stroke(1.2);g.restore();}
function wash(a=0.55){g.fillStyle=`rgba(244,239,228,${a})`;g.fillRect(0,0,W,H);}

const titleDemo={x:0,y:0,w:20,h:28,vx:150,vy:0,face:1,sx:1,sy:1,anim:'run',runPhase:0,dead:false,invuln:0,dashT:0};
function drawTitle(){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);g.drawImage(paperTex,0,0);
  // decorative hills
  g.save();g.globalAlpha=0.5;const pts=[];for(let x=-20;x<=W+20;x+=36){const i=x/36;pts.push([x,H*0.72-(0.5+0.5*Math.sin(i*0.33))*60-14*Math.sin(i*0.9)]);}wobblyPath(pts,false,5,1);stroke(2);g.restore();
  // ground line
  inkLine(60,H*0.78,W-60,H*0.78,{w:3,seed:1});g.save();g.globalAlpha=0.5;for(let i=0;i<30;i++)inkLine(70+i*28,H*0.78+3,62+i*28,H*0.78+16,{w:1,seed:i});g.restore();
  // big title
  g.save();g.translate(W/2,H*0.3);g.rotate(-0.02);inkText('墨 痕',0,0,112);g.restore();
  g.save();g.globalAlpha=0.8;wobblyPath([[W/2-150,H*0.3+62],[W/2+150,H*0.3+66]],false,6,2);stroke(3);g.restore();
  txt('I N K B O U N D',W/2,H*0.3+90,22,'center',GREY);
  // seal
  g.save();g.translate(W/2+200,H*0.3-40);g.rotate(0.12);wobblyPath([[-22,-22],[22,-22],[22,22],[-22,22]],true,7,1.2);fillPath(SEAL);txt('跃',0,2,30,'center',PAPER);g.restore();
  // running character demo
  titleDemo.runPhase+=0.016*150*0.085;titleDemo.x=W/2-10+Math.sin(time*0.8)*140;titleDemo.face=Math.cos(time*0.8)>0?1:-1;titleDemo.vx=titleDemo.face*150;titleDemo.y=H*0.78-28;
  g.save();const fx=titleDemo.x+10,fy=titleDemo.y+28;g.translate(fx,fy);g.scale(1.8,1.8);g.translate(-fx,-fy);drawPlayer(titleDemo);g.restore();
  updateParts(1/60);drawParts();
  // floating drops
  for(let i=0;i<5;i++){const d={x:100+i*180+Math.sin(time+i)*10,y:H*0.52+Math.cos(time*1.3+i*1.7)*14,id:i,ph:i,got:false};drawDrop(d);}
  const blink=Math.sin(time*4)>-0.3;if(blink)inkText('按 空格 / 点击 开始',W/2,H*0.9,26);
  g.save();g.globalAlpha=0.7;txt('← → 移动   空格/Z 跳跃(二段跳·蹬墙跳)   Shift/X 冲刺   P 暂停   R 重开本章   M 静音',W/2,H*0.96,15,'center',GREY);g.restore();
  drawBorder();
}

function render(){
  g=ctx;
  if(state==='title'){drawTitle();}
  else{
    drawBackground();drawWorld();drawHUD();drawBorder();
    if(state==='pause'){wash(0.5);overlayBox(360,160);inkText('暂 停',W/2,H/2-30,44);txt('按 P 或 空格 继续',W/2,H/2+34,20,'center',GREY);}
    else if(state==='clear'){const k=Math.min(1,stateT*2);g.save();g.globalAlpha=k;wash(0.5);overlayBox(460,250);inkText('关卡完成',W/2,H/2-80,46);
      inkLine(W/2-150,H/2-48,W/2+150,H/2-48,{w:2});
      txt(`墨滴收集　${gotDrops} / ${totalDrops}`,W/2,H/2-12,26);txt(`用时　${fmt(levelTime)}`,W/2,H/2+28,26);
      if(gotDrops===totalDrops)txt('✦ 全部收集 ✦',W/2,H/2+62,20,'center',RED);
      if(stateT>0.8&&Math.sin(time*4)>-0.3)txt(lvlIndex+1<LEVELS.length?'按 空格 进入下一章':'按 空格 查看结局',W/2,H/2+100,20,'center',GREY);g.restore();}
    else if(state==='over'){wash(0.6);overlayBox(420,200);inkText('墨 尽',W/2,H/2-40,54);txt('纸上的旅程暂告段落',W/2,H/2+14,20,'center',GREY);if(stateT>0.8&&Math.sin(time*4)>-0.3)txt('按 空格 / R 重试本章',W/2,H/2+64,22);}
    else if(state==='win'){g.fillStyle=PAPER;g.fillRect(0,0,W,H);g.drawImage(paperTex,0,0);
      g.save();g.translate(W/2,H*0.26);inkText('墨 尽 纸 终',0,0,80);g.restore();
      inkLine(W/2-200,H*0.26+56,W/2+200,H*0.26+60,{w:3});
      txt('穿过三章纸境，墨痕已留在每一页。',W/2,H*0.46,24);
      txt(`总用时　${fmt(runTotalTime)}`,W/2,H*0.58,26);txt(`墨滴　${runTotalGot} / ${runTotalDrops}`,W/2,H*0.66,26);
      if(runTotalGot===runTotalDrops)txt('✦ 一滴不漏 ✦',W/2,H*0.74,22,'center',RED);
      g.save();g.translate(W/2+260,H*0.6);g.rotate(0.1);wobblyPath([[-26,-26],[26,-26],[26,26],[-26,26]],true,7,1.2);fillPath(SEAL);txt('终',0,2,36,'center',PAPER);g.restore();
      if(stateT>1&&Math.sin(time*4)>-0.3)txt('按 空格 回到标题',W/2,H*0.9,22,'center',GREY);drawBorder();}
  }
  // ink transition
  if(trans){const k=trans.t/trans.dur;const maxR=Math.hypot(W,H)*0.75;g.save();g.fillStyle=INK;
    if(k<0.5){const r=Math.pow(k*2,1.6)*maxR;inkCircle(trans.cx,trans.cy,Math.max(1,r),321,r*0.08);g.fill();
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2+k*3;const rr=r*(1.05+hashf(i,3,boil)*0.1);inkCircle(trans.cx+Math.cos(a)*rr,trans.cy+Math.sin(a)*rr,r*0.08+6,i,1);g.fill();}}
    else{const r=Math.pow((k-0.5)*2,0.7)*maxR;g.beginPath();g.rect(-10,-10,W+20,H+20);const n=40;for(let i=0;i<=n;i++){const a=-i/n*Math.PI*2;const rr=r*(1+hashf(i%n,5,boil)*0.06);const x=W/2+Math.cos(a)*rr,y=H/2+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.fill('evenodd');}
    g.restore();}
}

// ---------------------------------------------------------------- loop
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;acc+=dt;let n=0;while(acc>=STEP&&n<4){update(STEP);acc-=STEP;n++;}if(n===4)acc=0;render();requestAnimationFrame(frame);}
loadLevel(0);state='title';
requestAnimationFrame(frame);
</script>
</body>
</html>
